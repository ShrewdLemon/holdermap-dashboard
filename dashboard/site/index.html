<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>holdermap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="app.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <a class="logo" href="#universe" aria-label="holdermap home">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect class="fillA" x="1" y="1" width="9" height="9"></rect><rect x="12" y="1" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="1" y="12" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="12" y="12" width="9" height="9" fill="currentColor"></rect></svg>
      <b>holdermap</b>
    </a>
    <nav class="tnav" aria-label="Primary">
      <a href="#universe" data-nav="universe">Universe</a>
      <a href="#overview" data-nav="company">Anand Rathi Wealth</a>
      <a href="#watchlist" data-nav="watchlist">Watchlist</a>
    </nav>
    <div class="gs" id="gs">
      <label for="q" class="vh">Search companies</label>
      <div class="gsbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="color:var(--barInk2)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Search company or symbol" aria-controls="gsres" aria-expanded="false">
        <span class="kbd" aria-hidden="true">/</span>
      </div>
      <div class="gsres" id="gsres" role="listbox" hidden></div>
    </div>
    <div class="tright">
      <span class="dt">NSE close · 23 Sep 2026</span>
      <button class="ibtn srchBtn" id="srchBtn" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <button class="ibtn" id="themeBtn" aria-label="Theme: system"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg></button>
    </div>
  </div>
</header>
<div id="co"></div>
<main class="view wrap" id="main" tabindex="-1"></main>
<nav class="bnav" aria-label="Sections">
  <a href="#universe" data-b="universe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>Universe</a>
  <a href="#overview" data-b="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Overview</a>
  <a href="#holders" data-b="holders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.4 3.6 5.2"></path></svg>Holders</a>
  <a href="#flows" data-b="flows"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v15M3 15l4 4 4-4M17 20V5M13 9l4-4 4 4"></path></svg>Flows</a>
  <a href="#evidence" data-b="evidence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg>Evidence</a>
</nav>
<div id="sheetRoot"></div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
