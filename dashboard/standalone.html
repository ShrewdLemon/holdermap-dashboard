<title>holdermap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --bg:#F4F3EF;--surface:#FFFFFF;--surface2:#FAF9F6;--ink:#15171C;--ink2:#4A505C;--ink3:#646B78;--rule:#E4E1DA;--rule2:#CFCBC2;
  --bar:#15171C;--barInk:#FFFFFF;--barInk2:#B9BEC8;--barField:#262931;--barLine:#3A3E48;
  --acc:#B8321C;--accSoft:#FBF1EE;--up:#1B7346;--dn:#B42318;--upSoft:#E8F3EC;--dnSoft:#FBECEA;
  --prom:#1B2F4E;--fii:#D9782D;--dii:#4F86C6;--ind:#A9B6C6;--oth:#D9D5CB;--rev:#C9CFD8;--grey:#8B93A1;
  --shadow:0 12px 40px rgba(21,23,28,.16);
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:'IBM Plex Sans',-apple-system,'Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1014;--surface:#161920;--surface2:#1B1F27;--ink:#ECEDEF;--ink2:#B7BCC6;--ink3:#8E95A2;--rule:#272B34;--rule2:#363B46;
  --bar:#0A0B0E;--barInk:#FFFFFF;--barInk2:#A3A9B5;--barField:#1A1D24;--barLine:#2E323C;
  --acc:#E8664C;--accSoft:#2A1814;--up:#4CC38A;--dn:#F2766A;--upSoft:#12261C;--dnSoft:#2B1614;
  --prom:#8FA9D6;--fii:#E8934F;--dii:#5B92D4;--ind:#6E7C8F;--oth:#454A55;--rev:#3A404C;--grey:#6F7785;--shadow:0 12px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1014;--surface:#161920;--surface2:#1B1F27;--ink:#ECEDEF;--ink2:#B7BCC6;--ink3:#8E95A2;--rule:#272B34;--rule2:#363B46;
  --bar:#0A0B0E;--barInk:#FFFFFF;--barInk2:#A3A9B5;--barField:#1A1D24;--barLine:#2E323C;
  --acc:#E8664C;--accSoft:#2A1814;--up:#4CC38A;--dn:#F2766A;--upSoft:#12261C;--dnSoft:#2B1614;
  --prom:#8FA9D6;--fii:#E8934F;--dii:#5B92D4;--ind:#6E7C8F;--oth:#454A55;--rev:#3A404C;--grey:#6F7785;--shadow:0 12px 40px rgba(0,0,0,.5)}
html,body{background:var(--bg)}
body{font-family:var(--sans);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:var(--serif)}.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--ink3)}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);box-sizing:border-box}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--barInk)}
.top .wrap{height:56px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.logo svg .fillA{fill:var(--acc)}
.tnav{display:flex;gap:26px;align-self:stretch}
.tnav a{display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--barInk2);border-bottom:3px solid transparent;padding-top:3px;transition:color .2s}
.tnav a:hover{color:var(--barInk)}
.tnav a[aria-current="page"]{color:var(--barInk);border-bottom-color:var(--acc)}
.gs{position:relative;flex:1;display:flex;justify-content:center}
.gsbox{width:min(440px,100%);height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--barField);border:1px solid var(--barLine);box-sizing:border-box;transition:border-color .2s}
.gsbox:focus-within{border-color:var(--barInk2)}
.gsbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--barInk);font:inherit;font-size:13px}
.gsbox input::placeholder{color:var(--barInk2)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--barInk2);border:1px solid var(--barLine);padding:0 6px}
.gsres{position:absolute;top:44px;width:min(440px,100%);background:var(--surface);color:var(--ink);border:1px solid var(--rule2);box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:50;animation:pop .18s var(--ease)}
.gsres button{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer}
.gsres button:hover,.gsres button.act{background:var(--surface2)}
.gsres .empty{padding:14px;color:var(--ink3);font-size:13px}
.tright{display:flex;align-items:center;gap:12px;flex-shrink:0;font-size:12px;color:var(--barInk2)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;background:transparent;border:1px solid var(--barLine);color:var(--barInk);cursor:pointer;transition:background .2s}
.ibtn:hover{background:var(--barField)}
.srchBtn{display:none}

/* company header */
.co{background:var(--surface);border-bottom:1px solid var(--rule)}
.co .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:16px}
.crumb{font-size:12px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap}
.crumb a:hover{color:var(--acc)}
.cohead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.coname{display:flex;flex-direction:column;gap:10px;min-width:0}
.coname h1{margin:0;font-family:var(--serif);font-size:clamp(26px,3.2vw,36px);font-weight:600;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink2);border:1px solid var(--rule);background:var(--surface2);padding:2px 7px}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.solid{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill.ok{color:var(--up)}.pill.warn{color:var(--acc)}
.star{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid var(--rule2);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600;transition:background .2s,border-color .2s}
.star:hover{border-color:var(--ink)}
.star[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc);color:var(--acc)}
.star[aria-pressed="true"] svg{fill:currentColor}
.px{display:flex;align-items:flex-end;gap:24px}
.pxv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pxv .big{font-size:clamp(26px,3vw,34px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pxv .chg{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pxv small,.pxs small{font-size:11px;color:var(--ink3)}
.pxs{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.stats{display:flex;border-top:1px solid var(--rule);padding-block:14px;margin-inline:-20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{display:flex;flex-direction:column;gap:3px;padding:0 20px;border-left:1px solid var(--rule);flex-shrink:0;scroll-snap-align:start}
.stat:first-child{border-left:0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--ink3)}
.range{position:relative;height:4px;background:var(--rule);margin-top:8px;width:180px}
.range i{position:absolute;left:0;top:0;height:4px;background:var(--ink);transform-origin:left;animation:growx .8s var(--ease) both}
.range b{position:absolute;top:-5px;width:2px;height:14px;background:var(--acc)}
.tabs{display:flex;gap:30px;border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-size:14px;font-weight:500;color:var(--ink2);padding:14px 0 12px;white-space:nowrap;transition:color .2s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs .tl{position:absolute;bottom:0;height:3px;background:var(--acc);transition:left .35s var(--ease),width .35s var(--ease)}

/* layout */
main.view{padding-block:28px 40px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.g2{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--rule);padding:24px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box;min-width:0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:12px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sh .eb{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.sh h2{margin:2px 0 0;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sh p{margin:4px 0 0;font-size:12px;color:var(--ink3);max-width:70ch}
.cap{font-size:12px;color:var(--ink3)}
.note{margin:0;font-size:12px;line-height:1.55;color:var(--ink2);padding:10px 12px;background:var(--accSoft)}
.note.grey{background:var(--surface2)}

/* segmented */
.seg{position:relative;display:inline-flex;border:1px solid var(--ink);background:var(--surface);flex-shrink:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:12px;font-weight:600;min-height:36px;padding:0 14px;cursor:pointer;white-space:nowrap;color:var(--ink);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--surface)}
.seg .ind{position:absolute;top:0;bottom:0;background:var(--ink);transition:left .3s var(--ease),width .3s var(--ease)}
.seg button .ct{font-weight:400;opacity:.7;margin-left:6px}

/* tables */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
.t{border-collapse:collapse;width:100%}
.t th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;padding:10px 8px 8px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
.t td{font-size:13px;padding:9px 8px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .l{text-align:left}
.t tbody tr{transition:background .15s}
.t tbody tr:hover td{background:var(--surface2)}
.t tr.sub td{color:var(--ink3);font-size:12px;padding-block:5px}
.t tr.tot td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:0}
.t th:first-child,.t td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.sw{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center}

/* charts */
.chart{width:100%;min-height:40px;position:relative}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink3)}
.chart .lab{fill:var(--ink2)}
.chart .strong{fill:var(--ink);font-weight:600}
.chart .inv{fill:#FFFFFF;font-weight:600}
.chart .grid{stroke:var(--rule);stroke-width:1}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms);transition:opacity .2s}
.chart svg:hover .bar{opacity:.55}.chart svg .bar:hover,.chart svg .bar.hl{opacity:1}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .15s forwards}
.hb{transform-origin:left;animation:growx .8s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.hb.neg{transform-origin:right}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.45;padding:8px 10px;max-width:240px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip b{font-weight:600}

/* list rows */
.lhead,.lrow>.rb{display:grid;align-items:center;gap:0 12px;padding:0 8px}
.lhead{border-bottom:1.5px solid var(--ink);padding-block:10px 8px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));background:var(--surface);z-index:2}
.lhead>*{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:right;white-space:nowrap}
.lhead .l,.rb .l{text-align:left}
.lhead button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;gap:4px;align-items:center}
.lhead button:hover{color:var(--ink)}
.lhead button[aria-sort] {color:var(--ink)}
.lrow{border-bottom:1px solid var(--rule);animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 18ms)}
.lrow>.rb{width:100%;min-height:52px;padding-block:8px;background:none;border:0;cursor:pointer;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;transition:background .15s}
.lrow>.rb:hover{background:var(--surface2)}
.rb .nm{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .sb{display:block;font-size:11px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .rk{color:var(--ink3);text-align:left}
.rb .chev{width:16px;height:16px;transition:transform .3s var(--ease);color:var(--ink3);justify-self:end}
.lrow.open>.rb .chev{transform:rotate(180deg)}
.lrow.open>.rb{background:var(--surface2)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.lrow.open .det{grid-template-rows:1fr}
.det>div{overflow:hidden}
.detin{padding:14px 8px 18px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 20px;background:var(--surface2)}
.detin .k{display:flex;flex-direction:column;gap:2px}
.detin .k b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.detin .wide{grid-column:1/-1}
.flag{display:inline-block;width:7px;height:7px;background:var(--acc);transform:rotate(45deg);margin-left:8px;vertical-align:1px}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;color:#FFFFFF;padding:2px 6px}
.tag.b{background:var(--up)}.tag.s{background:var(--dn)}
.ltot{display:grid;align-items:center;gap:0 12px;padding:12px 8px;font-weight:600;border-top:1.5px solid var(--ink);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.ltot .l{text-align:left}

/* holders grid */
.gH{grid-template-columns:24px minmax(200px,2.4fr) 48px repeat(4,minmax(70px,1fr)) 100px repeat(3,minmax(48px,.6fr)) minmax(82px,.9fr) 16px}
.gU{grid-template-columns:28px minmax(200px,2.6fr) repeat(8,minmax(64px,1fr)) 16px}
.gF{grid-template-columns:22px minmax(160px,2.4fr) repeat(4,minmax(64px,1fr)) 16px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--rule);transition:border-color .2s,transform .2s var(--ease)}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);padding:18px 22px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink2);line-height:1.4}

/* pattern */
.pbar{display:flex;height:18px;overflow:hidden}
.pbar i{display:block;height:100%;transform-origin:left;animation:growx .9s var(--ease) both}
.prow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--rule);gap:12px}
.ins{list-style:none;margin:0;padding:0}
.ins li{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-bottom:1px solid var(--rule)}
.ins .tg{font-family:var(--mono);font-size:10px;letter-spacing:.08em}
.ins b{font-size:14px;font-weight:600;line-height:1.35}
.ins span.b{font-size:12px;color:var(--ink2);line-height:1.5}

/* universe */
.uhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.uhead h1{margin:6px 0 6px;font-family:var(--serif);font-size:clamp(26px,3.4vw,34px);font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.ustat{display:flex;gap:28px}
.ustat div{display:flex;flex-direction:column;align-items:flex-end}
.ustat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.pin{display:grid;grid-template-columns:1.6fr repeat(5,minmax(0,1fr)) auto;align-items:center;gap:16px;padding:16px 20px;background:var(--surface);border:1px solid var(--ink);border-left:4px solid var(--acc);transition:transform .25s var(--ease),box-shadow .25s}
.pin:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pin .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pin .go{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pin:hover .go svg{transform:translateX(4px)}
.pin .go svg{transition:transform .25s var(--ease)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fchips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fchip{display:inline-flex;gap:8px;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--ink);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.fchip .ct{font-weight:400;opacity:.7}
.field{height:36px;padding:0 10px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;box-sizing:border-box}
.more{align-self:center;min-height:40px;padding:0 20px;border:1px solid var(--ink);background:var(--surface);font-weight:600;font-size:13px;cursor:pointer;transition:background .2s}
.more:hover{background:var(--surface2)}
.btn{min-height:36px;padding:0 14px;border:1px solid var(--ink);background:var(--surface);font-weight:600;font-size:12px;cursor:pointer;transition:background .2s,color .2s}
.btn.pri{background:var(--ink);color:var(--surface)}
.btn:hover{background:var(--surface2)}.btn.pri:hover{background:var(--ink2)}
.minibar{display:block;height:3px;margin-top:4px;background:var(--prom);margin-left:auto;transform-origin:right;animation:growx .6s var(--ease) both}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,11,14,.45);z-index:90;animation:fade .2s both}
.sheet{position:fixed;z-index:91;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slidein .35s var(--ease) both;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sbody{padding:24px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.sheet h2{margin:0;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sgrid div{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--rule)}
.sgrid b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

/* review */
.rv{display:grid;grid-template-columns:minmax(180px,2fr) minmax(110px,1fr) minmax(110px,1fr) 90px 100px minmax(170px,auto);gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--rule);font-size:13px}
.rv.h{border-bottom:1.5px solid var(--ink);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.rv .acts{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.rv .done{font-size:12px;font-weight:600;animation:pop .25s var(--ease)}
.progress{height:4px;background:var(--rule);position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--up);transition:width .4s var(--ease)}

footer.src{font-size:11px;line-height:1.6;color:var(--ink3);padding-block:8px 32px}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}

@keyframes pop{from{opacity:0;transform:scale(.97)}}

@keyframes slideup{from{transform:translateY(100%)}}

}
function toggleRow(row, force) {
  const btn = $('.rb', row), det = $('.det>div', row), open = force != null ? force : !row.classList.contains('open');
  if (open && !det.innerHTML) {
    const id = row.dataset.row;
    if (row.dataset.flow) { const f = D.flows[S.fP].all.find(o => slug(o.n) === id); det.innerHTML = f ? flowDetail(f.n) : ''; }
    else { const h = GROUPS[S.hTab].find(x => x.id === id); det.innerHTML = h ? holderDetail(h) : ''; }
    void row.offsetWidth;
  }
  row.classList.toggle('open', open); btn.setAttribute('aria-expanded', open);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-act],[data-go],[data-sort]');
  if (!t) return;
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val;
    if (S[k] === v && k !== 'hTab') return;
    S[k] = v;
    if (k === 'unit') patch('ownBody', ownBody);
    else if (k === 'em') { S.eMetric = v; patch('earnBody', earnBody); }
    else if (k === 'rh') { S.rH = v; patch('retBody', retBody); }
    else if (k === 'hTab') { S.hSort = 's'; S.hDir = -1; const c = $('#hCard'); if (c) { c.firstElementChild.outerHTML = holdersHead(); patch('hBody', holdersBody); if (t.classList.contains('kpi')) c.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); } }
    else if (k === 'basis') patch('hBody', holdersBody);
    else if (k === 'fP') { S.fG = null; patch('fBody', flowsBody); }
    else if (k === 'uB') { S.uN = 20; $$('.fchip[data-set="uB"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.val === v)); patch('uBody', uBody); }
    $$(`[data-set="${k}"]`).forEach(b => b.setAttribute('aria-pressed', b.dataset.val === S[k]));
    requestAnimationFrame(() => placeSegs(document));
    return;
  }
  if (t.dataset.sort) {
    const w = t.dataset.sort, k = t.dataset.k;
    if (w === 'h') { if (S.hSort === k) S.hDir *= -1; else { S.hSort = k; S.hDir = k === 'n' || k === 'cty' ? 1 : -1; } patch('hBody', holdersBody); }
    else { if (S.uSort === k) S.uDir *= -1; else { S.uSort = k; S.uDir = k === 'n' ? 1 : -1; } patch('uBody', uBody); }
    return;
  }
  if (t.dataset.go) {
    e.preventDefault();
    const p = t.dataset.go.split('|');
    if (p[0] === 'flows') { S.fP = p[1]; S.fG = null; S.focus = p[2]; go('flows'); }
    else if (p[0] === 'holders') { S.hTab = p[1]; S.focus = p[2] || null; S.hSort = 's'; S.hDir = -1; S.basis = 'pct'; go('holders'); }
    else if (p[0] === 'cat') { S.openCat[p[1]] = true; patch('ownBody', ownBody); setTimeout(() => $('#own').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }), 60); }
    return;
  }
  const a = t.dataset.act;
  if (a === 'cat') { S.openCat[t.dataset.k] = !S.openCat[t.dataset.k]; patch('ownBody', ownBody); }
  else if (a === 'catgo') { S.openCat[t.dataset.k] = true; patch('ownBody', ownBody); $('#own').scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); }
  else if (a === 'row' || a === 'frow') toggleRow(t.closest('.lrow'));
  else if (a === 'fgrp') { S.fG = S.fG === t.dataset.g ? null : t.dataset.g; patch('fBody', flowsBody); }
  else if (a === 'sheet') { if (t.dataset.sym === 'ANANDRATHI' && t.classList.contains('rb')) go('overview'); else openSheet(t.dataset.sym); }
  else if (a === 'close') { closeSheet(); }
  else if (a === 'more') { S.uN += 20; patch('uBody', uBody); }
  else if (a === 'watch') {
    const s = t.dataset.sym, i = S.watch.indexOf(s);
    if (i >= 0) S.watch.splice(i, 1); else S.watch.push(s);
    store.set('watch', S.watch);
    const on = S.watch.includes(s);
    $$(`[data-act="watch"][data-sym="${s}"]`).forEach(b => { b.setAttribute('aria-pressed', on); $('span', b).textContent = on ? 'Watching' : (b.closest('.sheet') ? 'Add to watchlist' : 'Watch'); });
    toast(on ? 'Added to watchlist' : 'Removed from watchlist');
    if (S.route === 'universe' && !t.closest('.sheet')) render();
  }
  else if (a === 'rv') { const n = t.dataset.n, v = t.dataset.v; if (v) S.review[n] = v; else delete S.review[n]; store.set('review', S.review); patch('rqBody', reviewBody); toast(v === 'keep' ? 'Category kept' : v === 'switch' ? 'Switched to the alternative' : 'Decision undone'); }
  else if (a === 'rvreset') { S.review = {}; store.set('review', S.review); patch('rqBody', reviewBody); toast('Decisions cleared'); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.sortsel === 'h') { S.hSort = e.target.value; S.hDir = e.target.value === 'n' ? 1 : -1; patch('hBody', holdersBody); }
  if (e.target.dataset.sortsel === 'u') { S.uSort = e.target.value; S.uDir = e.target.value === 'n' ? 1 : -1; patch('uBody', uBody); }
});
let uqT;
document.addEventListener('input', e => {
  if (e.target.id === 'uq') { clearTimeout(uqT); S.uQ = e.target.value; S.uN = 20; uqT = setTimeout(() => patch('uBody', uBody), 120); }
  if (e.target.id === 'q') gsearch(e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.sheet')) closeSheet(); gsClose(); $('#top').classList.remove('searching'); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); if (window.innerWidth <= 760) $('#top').classList.add('searching'); $('#q').focus(); }
});
window.addEventListener('hashchange', () => { closeSheet(); parseHash(); render(); window.scrollTo(0, 0); });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { drawCharts(document, true); placeSegs(document); }, 120); });

/* global search */
let gsSel = 0, gsItems = [];
function gsearch(v) {
  const r = $('#gsres'), q = v.trim().toLowerCase();
  if (!q) { gsClose(); return; }
  gsItems = D.univ.filter(u => u.n.toLowerCase().includes(q) || u.s.toLowerCase().includes(q)).slice(0, 8); gsSel = 0;
  r.hidden = false; $('#q').setAttribute('aria-expanded', 'true');
  r.innerHTML = gsItems.length ? gsItems.map((u, i) => `<button type="button" role="option" data-gs="${u.s}" class="${i === 0 ? 'act' : ''}"><span><b style="font-weight:600">${esc(u.n)}</b><span class="mono" style="display:block;font-size:11px;color:var(--ink3)">${u.s}</span></span><span class="num" style="font-size:12px;color:var(--ink2)">₹${fin(u.m)} cr</span></button>`).join('') : `<div class="empty">No company matches “${esc(v)}”.</div>`;
}
function gsClose() { const r = $('#gsres'); r.hidden = true; r.innerHTML = ''; $('#q').setAttribute('aria-expanded', 'false'); }
function gsPick(sym) { gsClose(); $('#q').value = ''; $('#top').classList.remove('searching'); if (sym === 'ANANDRATHI') go('overview'); else openSheet(sym); }
$('#gsres').addEventListener('click', e => { const b = e.target.closest('[data-gs]'); if (b) gsPick(b.dataset.gs); });
$('#q').addEventListener('keydown', e => {
  if (!gsItems.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); gsSel = (gsSel + (e.key === 'ArrowDown' ? 1 : -1) + gsItems.length) % gsItems.length; $$('#gsres [data-gs]').forEach((b, i) => b.classList.toggle('act', i === gsSel)); }
  if (e.key === 'Enter') { e.preventDefault(); gsPick(gsItems[gsSel].s); }
});
$('#q').addEventListener('blur', () => setTimeout(() => { gsClose(); if (!$('#q').value) $('#top').classList.remove('searching'); }, 180));
$('#srchBtn').addEventListener('click', () => { $('#top').classList.add('searching'); $('#q').focus(); });

/* theme */
const THEMES = ['system', 'light', 'dark'];
let theme = store.get('theme', 'system');
function applyTheme() { if (theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme); $('#themeBtn').setAttribute('aria-label', 'Theme: ' + theme); $('#themeBtn').title = 'Theme: ' + theme; }
$('#themeBtn').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(); toast('Theme: ' + theme); });
applyTheme();

/* tooltip */
const tip = $('#tip'); let tipT;
function showTip(el, x, y) { tip.innerHTML = el.getAttribute('data-tip'); tip.classList.add('on'); const r = tip.getBoundingClientRect(); let L = x + 14, Tp = y + 14; if (L + r.width > window.innerWidth - 8) L = x - r.width - 14; if (Tp + r.height > window.innerHeight - 8) Tp = y - r.height - 14; tip.style.left = Math.max(8, L) + 'px'; tip.style.top = Math.max(8, Tp) + 'px'; }
document.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { showTip(el, e.clientX, e.clientY); clearTimeout(tipT); tipT = setTimeout(() => tip.classList.remove('on'), 2600); } else tip.classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && el.getBoundingClientRect) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.bottom); } });
document.addEventListener('focusout', () => tip.classList.remove('on'));
window.addEventListener('scroll', () => tip.classList.remove('on'), { passive: true });

parseHash(); render();
})();
</script>
