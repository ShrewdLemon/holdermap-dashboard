AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  holdermap dashboard: a standalone static site (S3 + CloudFront) behind an access-link
  gate. Separate from every other site in the account; nothing here is shared with them.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  Oac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Opening the access link (…/?key=<key>) sets a 30-day cookie; every request needs it.
  # Only the key's SHA-256 is here (injected by scripts/deploy_dashboard.sh), never the key.
  Gate:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-gate"
      AutoPublish: true
      FunctionConfig:
        Comment: holdermap dashboard access-link gate
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        const crypto = require('crypto');
        const KEY_HASH = '__KEY_HASH__';
        const TOKEN = crypto.createHash('sha256').update(KEY_HASH + '|cookie-v1').digest('hex');
        function locked() {
          return { statusCode: 401, statusDescription: 'Unauthorized',
            headers: { 'content-type': { value: 'text/html; charset=utf-8' }, 'cache-control': { value: 'no-store' } },
            body: '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>holdermap</title>' +
              '<body style="margin:0;font:15px/1.5 -apple-system,Segoe UI,Arial,sans-serif;color:#333;display:grid;place-items:center;min-height:90vh">' +
              '<div style="text-align:center"><div style="font-weight:700;color:#16406b;font-size:19px">holdermap</div>' +
              '<p>Open this site with the link you were given.</p></div></body>' };
        }
        function handler(event) {
          const req = event.request;
          const q = req.querystring;
          if (q.key && q.key.value) {
            const h = crypto.createHash('sha256').update(q.key.value).digest('hex');
            if (h !== KEY_HASH) return locked();
            return { statusCode: 302, statusDescription: 'Found',
              headers: { location: { value: req.uri }, 'cache-control': { value: 'no-store' } },
              cookies: { hv: { value: TOKEN, attributes: 'Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax' } } };
          }
          const c = req.cookies.hv;
          if (!c || c.value !== TOKEN) return locked();
          if (req.uri.endsWith('/')) req.uri += 'index.html';
          return req;
        }

  Headers:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
              font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none';
              base-uri 'none'; frame-ancestors 'none'
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: no-referrer, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 15552000, Override: true }
        CustomHeadersConfig:
          Items:
            - { Header: X-Robots-Tag, Value: "noindex, nofollow", Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: holdermap dashboard (standalone)
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: s3
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt Oac.Id
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref Headers
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt Gate.FunctionMetadata.FunctionARN

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${Bucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName: { Value: !Ref Bucket }
  DistributionId: { Value: !Ref Distribution }
  Url: { Value: !Sub "https://${Distribution.DomainName}" }
